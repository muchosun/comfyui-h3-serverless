name: build-push
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub auth (token from secret, never printed)
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          AUTH=$(printf 'muchosun:%s' "$TOKEN" | base64 -w0)
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
          echo "auth config written"
      - name: Get crane
        run: |
          set -e
          cd /tmp
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz -o crane.tgz
          tar xzf crane.tgz crane
          ./crane version
      - name: Assemble layer (files + vendored runpod + H3 custom nodes)
        run: |
          set -e
          rm -rf /tmp/rootfs && mkdir -p /tmp/rootfs/opt/rp/vendor /tmp/rootfs/ComfyUI/custom_nodes
          cp handler.py start.sh /tmp/rootfs/opt/rp/
          chmod +x /tmp/rootfs/opt/rp/start.sh
          python3 -m pip install --quiet --no-cache-dir --target /tmp/rootfs/opt/rp/vendor runpod
          # Bake SageAttention into the venv so --use-sage-attention actually accelerates
          # attention. The base image only ADDs the wheel to /opt/sage; the pod's runtime
          # installs it — our lean launch skipped that, so attention fell back to slow default.
          mkdir -p /tmp/sage
          ( cd /tmp/sage && curl -fsSL -O "https://github.com/Hearmeman24/comfyui-runtime/releases/download/sage-d1a57a5-cu130-torch2.11.0/sageattention-2.2.0-cp312-cp312-linux_x86_64.whl" )
          python3 -m pip install --quiet --no-deps --target /tmp/rootfs/opt/venv/lib/python3.12/site-packages /tmp/sage/sageattention-2.2.0-cp312-cp312-linux_x86_64.whl
          echo "sage baked:"; ls /tmp/rootfs/opt/venv/lib/python3.12/site-packages | grep -i sage
          # Bake the H3 custom nodes (template.json custom_nodes.target=image -> the pod
          # clones these into /ComfyUI/custom_nodes at boot; that dir is ephemeral on
          # serverless, so bake them here). All deps already in the venv; no pip needed.
          cd /tmp/rootfs/ComfyUI/custom_nodes
          clone(){ git clone --quiet "$1" "$2" && git -C "$2" checkout --quiet "$3" && rm -rf "$2/.git"; }
          clone https://github.com/LBH-123-AI/Comfyui_Minimax_h3_latent_Upscaler.git Comfyui_Minimax_h3_latent_Upscaler d7c01b9011f2e8439493f6c02c29995a27df276f
          clone https://github.com/Luisacaotica/ComfyUI-MiniMaxH3Mod.git ComfyUI-MiniMaxH3Mod 22ca77e247375dd47fc7340286b5f391887d3410
          clone https://github.com/Saganaki22/ComfyUI-Viggle-Animate-H3.git ComfyUI-Viggle-Animate-H3 77425b6f955e98e96c5e0dc6ca199dc62e63ad8a
          ( cd /tmp/rootfs && tar --numeric-owner --owner=0 --group=0 -cf /tmp/layer.tar opt ComfyUI )
          echo "layer bytes: $(stat -c %s /tmp/layer.tar)"; echo "nodes:"; ls -1 /tmp/rootfs/ComfyUI/custom_nodes
      - name: Append layer + set config + push (crane)
        run: |
          set -e
          cd /tmp
          IMG=docker.io/muchosun/comfyui-h3-serverless:v10
          BASE=docker.io/hearmeman/comfyui-minimax-template:v9
          ./crane mutate "$BASE" \
            --append /tmp/layer.tar \
            --entrypoint /opt/rp/start.sh \
            --cmd '' \
            --env I2V_POLL_TIMEOUT_S=900 \
            --env I2V_MAX_INLINE_MB=25 \
            --env I2V_CLEANUP=1 \
            --env COMFY_BOOT_TIMEOUT_S=600 \
            --env COMFY_HOST=127.0.0.1:8188 \
            --env COMFY_INPUT_DIR=/ComfyUI/input \
            --env COMFY_OUTPUT_DIR=/ComfyUI/output \
            -t "$IMG"
          echo "pushed digest:"; ./crane digest "$IMG"
          ./crane config "$IMG" | python3 -c 'import sys,json;c=json.load(sys.stdin)["config"];print("Entrypoint:",c.get("Entrypoint"));print("Cmd:",c.get("Cmd"))'
